<!doctype html>
<html lang="zh-CN" data-report-theme="job-evidence-v1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root{--ink:#0f0e15;--ink2:#17151f;--cream:#f3ede2;--paper:#e9e1d4;--red:#f43d3f;--muted:#85818b;--line:#c8bfb1;--white:#fffaf2;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;--sans:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--ink)}
    body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--sans);line-height:1.65}
    button{font:inherit}
    .hero{min-height:720px;position:relative;overflow:hidden;border-bottom:1px solid rgba(243,237,226,.25);background-color:var(--ink);background-image:linear-gradient(rgba(243,237,226,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(243,237,226,.055) 1px,transparent 1px);background-size:72px 72px}
    .hero:before{content:"";position:absolute;inset:-20% -10% auto auto;width:760px;height:760px;border:1px solid rgba(244,61,63,.45);transform:rotate(24deg);box-shadow:0 0 0 80px rgba(244,61,63,.025),0 0 0 160px rgba(244,61,63,.02)}
    .shell{width:min(1180px,calc(100% - 48px));margin:auto;position:relative}
    .topbar{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(243,237,226,.22)}
    .brand{font:700 13px var(--mono);letter-spacing:.18em;text-transform:uppercase}
    .brand b{color:var(--red)}
    .topmeta{font:11px var(--mono);color:#aaa5ae;text-align:right;text-transform:uppercase}
    .hero-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.7fr);gap:72px;padding:86px 0 96px;align-items:end}
    .eyebrow,.section-label{font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
    h1{font-size:clamp(54px,8.1vw,116px);line-height:.91;letter-spacing:-.07em;margin:26px 0 28px;font-weight:950;max-width:930px}
    h1 span{display:block;color:transparent;-webkit-text-stroke:1px rgba(243,237,226,.52)}
    .hero-summary{font-size:18px;color:#bbb5bd;max-width:720px;margin:0}
    .verdict{clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,0 100%);border:1px solid rgba(243,237,226,.38);background:rgba(15,14,21,.8);padding:28px;position:relative}
    .verdict:before{content:"";position:absolute;left:0;top:0;width:86px;height:4px;background:var(--red)}
    .verdict-label{font:11px var(--mono);color:#aaa5ae;text-transform:uppercase}
    .verdict-main{font-size:38px;font-weight:900;line-height:1.1;margin:14px 0 10px}
    .verdict p{margin:0;color:#b8b2ba;font-size:14px}
    .ticker{background:var(--red);color:var(--ink);height:46px;overflow:hidden;display:flex;align-items:center;border-block:1px solid var(--ink)}
    .ticker-track{display:flex;gap:42px;white-space:nowrap;font:800 12px var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .ticker-track span:before{content:"◆";margin-right:42px}
    main{background:var(--cream);color:var(--ink);padding:92px 0 110px}
    .intro{display:grid;grid-template-columns:220px 1fr;gap:54px;padding-bottom:46px;border-bottom:1px solid var(--line)}
    .intro h2,.section h2{font-size:clamp(40px,5vw,70px);line-height:1;letter-spacing:-.055em;margin:8px 0 22px;font-weight:950}
    .intro p{font-size:18px;max-width:800px;color:#514c52}
    .score-grid{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--line);margin:54px 0 90px}
    .score{min-height:210px;padding:26px 24px;border-right:1px solid var(--line);border-block:1px solid var(--line);position:relative;background:rgba(255,255,255,.12)}
    .score:after{content:"";position:absolute;left:0;bottom:0;height:7px;width:var(--score);background:var(--red)}
    .score-name{display:flex;align-items:center;gap:7px;font:700 12px var(--sans);letter-spacing:0;color:#514b53}
    .help{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;padding:0;border:1px solid #777078;border-radius:50%;background:transparent;color:#625c64;font:800 11px/1 var(--mono);cursor:help}
    .help:focus-visible{outline:2px solid var(--red);outline-offset:3px}
    .help:after{content:attr(data-tip);position:absolute;z-index:20;left:50%;top:calc(100% + 11px);width:260px;max-width:72vw;padding:12px 14px;transform:translate(-50%,-4px);background:var(--ink);color:var(--cream);border:1px solid var(--red);box-shadow:0 12px 28px rgba(15,14,21,.22);font:13px/1.55 var(--sans);text-align:left;letter-spacing:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,transform .16s ease,visibility .16s}
    .help:hover:after,.help:focus-visible:after,.help.is-open:after{opacity:1;visibility:visible;transform:translate(-50%,0)}
    .score-value{font-size:68px;line-height:1;margin:38px 0 4px;font-weight:950;letter-spacing:-.08em}
    .score-value small{font:12px var(--mono);letter-spacing:0;color:#777078}
    .section{padding:76px 0;border-top:1px solid var(--line)}
    .section-head{display:grid;grid-template-columns:220px 1fr;gap:54px;margin-bottom:36px}
    .section-note{max-width:650px;color:#615b61}
    .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .card{position:relative;border:1px solid #bcb3a6;background:rgba(255,255,255,.22);padding:25px 26px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
    .card:before{content:"";position:absolute;left:0;top:0;width:72px;height:4px;background:var(--red)}
    .card h3{font-size:20px;line-height:1.3;margin:8px 0 12px}
    .card p{margin:7px 0;color:#575158}
    .micro{font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#756f76}
    .badge{display:inline-block;padding:3px 8px;border:1px solid #918991;font:700 10px var(--mono);text-transform:uppercase;margin-right:6px}
    .badge.red{background:var(--red);border-color:var(--red);color:var(--ink)}
    .badge.dark{background:var(--ink);border-color:var(--ink);color:var(--cream)}
    .req-table{border-top:2px solid var(--ink)}
    .req{display:grid;grid-template-columns:70px minmax(190px,.8fr) 120px 120px minmax(250px,1.3fr);gap:18px;padding:18px 8px;border-bottom:1px solid var(--line);align-items:start}
    .req.head{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#6f6870;padding-block:11px}
    .req-id{font:800 13px var(--mono);color:var(--red)}
    .req-title{font-weight:800;line-height:1.4}
    .req-evidence{color:#625c63;font-size:14px}
    .meter{height:6px;background:#cdc4b7;margin-top:9px}.meter i{display:block;height:100%;background:var(--ink)}
    .timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
    .step{padding:28px;min-height:180px;border-right:1px solid var(--line)}
    .step:last-child{border-right:0}.step h3{font-size:18px;margin:18px 0 8px}.step p{color:#5d575e}
    .diff{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .diff div{padding:15px;border:1px solid var(--line);font-size:14px}.diff .after{border-color:var(--red)}
    .question{counter-increment:q}.questions{counter-reset:q}.question h3:before{content:counter(q,decimal-leading-zero) " / ";font:800 12px var(--mono);color:var(--red)}
    .footer{background:var(--ink);padding:58px 0;color:#98939d;border-top:1px solid rgba(243,237,226,.2)}
    .footer-grid{display:flex;justify-content:space-between;gap:30px;font:11px var(--mono);text-transform:uppercase}
    .print{position:fixed;right:22px;bottom:22px;z-index:5;background:var(--red);color:var(--ink);border:1px solid var(--ink);padding:12px 18px;font:800 11px var(--mono);text-transform:uppercase;cursor:pointer;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
    @media(max-width:820px){
      .shell{width:min(100% - 28px,1180px)}.hero{min-height:auto}.topbar{height:70px}.topmeta{display:none}
      .hero-grid{grid-template-columns:1fr;gap:42px;padding:62px 0 70px}.hero-summary{font-size:16px}.verdict{max-width:none}
      .intro,.section-head{grid-template-columns:1fr;gap:10px}.score-grid{grid-template-columns:1fr 1fr}.score{min-height:165px}.score-value{font-size:52px;margin-top:25px}.help:after{left:0;transform:translate(0,-4px)}.help:hover:after,.help:focus-visible:after,.help.is-open:after{transform:translate(0,0)}
      main{padding:64px 0 76px}.section{padding:56px 0}.cards{grid-template-columns:1fr}
      .req.head{display:none}.req{grid-template-columns:54px 1fr;gap:10px}.req>*:nth-child(n+3){grid-column:2}
      .timeline{grid-template-columns:1fr}.step{border-right:0;border-bottom:1px solid var(--line)}.step:last-child{border-bottom:0}
      .diff{grid-template-columns:1fr}.footer-grid{flex-direction:column}.print{position:static;margin:0 0 20px 14px}
    }
    @media(max-width:440px){h1{font-size:52px}.score-grid{grid-template-columns:1fr}.score{min-height:145px}.intro h2,.section h2{font-size:40px}.ticker-track{gap:25px}.ticker-track span:before{margin-right:25px}}
    @media print{.print{display:none}.hero{min-height:0}.hero-grid{padding-block:45px}.ticker{display:none}main{padding-block:50px}.section{break-inside:avoid}.card,.score{break-inside:avoid}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
  </style>
</head>
<body>
{{REPORT_BODY}}
<script>
  document.querySelector(".print")?.addEventListener("click",()=>window.print());
  document.querySelectorAll(".help").forEach(button=>{
    button.addEventListener("click",event=>{
      event.stopPropagation();
      const open=!button.classList.contains("is-open");
      document.querySelectorAll(".help.is-open").forEach(item=>{item.classList.remove("is-open");item.setAttribute("aria-expanded","false")});
      button.classList.toggle("is-open",open);
      button.setAttribute("aria-expanded",String(open));
    });
  });
  document.addEventListener("click",()=>document.querySelectorAll(".help.is-open").forEach(item=>{item.classList.remove("is-open");item.setAttribute("aria-expanded","false")}));
</script>
</body>
</html>
