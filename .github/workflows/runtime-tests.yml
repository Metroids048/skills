name: Personal AI Runtime tests

on:
  push:
    branches: [main, agent/personal-ai-runtime-v2]
  pull_request:

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install pytest==9.0.2
      - name: Validate JSON registries
        run: |
          python -m json.tool registry/skills.json > /dev/null
          python -m json.tool registry/projects.json > /dev/null
          python -m json.tool manifest.json > /dev/null
          python -m json.tool tests/fixtures/routing_cases.json > /dev/null
      - name: Runtime tests
        run: python -m pytest -q
      - name: Compile Python runtime
        run: python -m compileall -q runtime scripts
